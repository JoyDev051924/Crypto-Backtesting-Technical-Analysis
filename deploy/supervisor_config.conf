[program:stock-bot]
command=/opt/trading-bot/venv/bin/python -m bot.stock_bot
directory=/opt/trading-bot
user=root
autostart=true
autorestart=true
stderr_logfile=/var/log/stock-bot.err.log
stdout_logfile=/var/log/stock-bot.out.log
environment=PATH="/opt/trading-bot/venv/bin"

[program:crypto-bot]
command=/opt/trading-bot/venv/bin/python -m bot.trading_bot_v3
directory=/opt/trading-bot
user=root
autostart=true
autorestart=true
stderr_logfile=/var/log/crypto-bot.err.log
stdout_logfile=/var/log/crypto-bot.out.log
environment=PATH="/opt/trading-bot/venv/bin"
